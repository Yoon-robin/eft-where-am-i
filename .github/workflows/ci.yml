name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Tailwind CSS 빌드에 필요
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Build solution
      run: dotnet build eft-where-am-i/eft-where-am-i.slnx -c Release

    - name: Run unit tests
      run: dotnet test tests/eft-where-am-i.Tests/eft-where-am-i.Tests.csproj -c Release --no-build
